name: Ahoge
options:
  bundleIdPrefix: com.quackyprog
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup
    from: 2.7.0
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 7.0.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  Ahoge:
    type: application
    platform: iOS
    sources:
      - path: Ahoge
    dependencies:
      - package: SwiftSoup
      - package: GRDB
    info:
      path: Ahoge/Info.plist
      properties:
        CFBundleDisplayName: Ahoge
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSPhotoLibraryAddUsageDescription: Save manga pages you share from the reader to your photos.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.quackyprog.ahoge.backup
            UTTypeDescription: Ahoge Backup
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - ahbk
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quackyprog.ahoge
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
  AhogeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/AhogeTests
    dependencies:
      - target: Ahoge
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Ahoge:
    build:
      targets:
        Ahoge: all
        AhogeTests: [test]
    test:
      targets:
        - AhogeTests
