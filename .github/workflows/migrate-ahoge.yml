name: Migrate Ahoge from reference repo

on:
  workflow_dispatch:
  push:
    branches: ["migration/clean-ahoge"]
    paths:
      - ".github/workflows/migrate-ahoge.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout clean destination
        uses: actions/checkout@v4
        with:
          ref: migration/clean-ahoge
          fetch-depth: 0

      - name: Fetch migration baseline
        run: git clone --depth 1 --branch main https://github.com/QuackyPROG/mihon-ios.git /tmp/mihon-ios

      - name: Copy audited application paths
        shell: bash
        run: |
          set -euo pipefail

          rm -rf Ahoge Ahoge.xcodeproj
          cp -R "/tmp/mihon-ios/Mihon IOS" Ahoge

          mkdir -p Ahoge.xcodeproj/project.xcworkspace
          cp "/tmp/mihon-ios/Mihon IOS.xcodeproj/project.pbxproj" Ahoge.xcodeproj/project.pbxproj
          cp "/tmp/mihon-ios/Mihon IOS.xcodeproj/project.xcworkspace/contents.xcworkspacedata" Ahoge.xcodeproj/project.xcworkspace/contents.xcworkspacedata

          cp /tmp/mihon-ios/LICENSE LICENSE
          cp /tmp/mihon-ios/.gitignore .gitignore
          cp /tmp/mihon-ios/.editorconfig .editorconfig

          # Remote source manifests, old docs, build logs, tools, xuserdata, and
          # other repository-level experimental artifacts are deliberately not copied.

          # This file is a hardcoded remote-source catalog. The runtime repository
          # already uses Local Files as the only built-in source, so it must not ship.
          rm -f Ahoge/Data/Sources/QuackyBuiltInSources.swift

          # Remove source-engine implementations only when they are provably unreferenced.
          remove_if_unreferenced() {
            local file="$1"
            local symbol="$2"
            if [ -f "$file" ] && ! grep -R --include='*.swift' --exclude="$(basename "$file")" -q "\b${symbol}\b" Ahoge; then
              rm -f "$file"
              echo "Removed unreferenced $file"
            fi
          }
          remove_if_unreferenced Ahoge/Data/Sources/AsuraAPISourceEngine.swift AsuraAPISourceEngine
          remove_if_unreferenced Ahoge/Data/Sources/AsuraHTMLSourceEngine.swift AsuraHTMLSourceEngine

          mv Ahoge/Mihon_IOSApp.swift Ahoge/AhogeApp.swift

      - name: Rename product and remove stale signing identity
        shell: python
        run: |
          from pathlib import Path

          pbx = Path("Ahoge.xcodeproj/project.pbxproj")
          text = pbx.read_text()
          replacements = {
              'Mihon IOS.app': 'Ahoge.app',
              '/* Mihon IOS */': '/* Ahoge */',
              '"Mihon IOS"': 'Ahoge',
              'path = "Mihon IOS";': 'path = Ahoge;',
              'productName = "Mihon IOS";': 'productName = Ahoge;',
              'PRODUCT_BUNDLE_IDENTIFIER = "giovanchristoffel.Mihon-IOS";': 'PRODUCT_BUNDLE_IDENTIFIER = com.quackyprog.ahoge;',
              'Unlock Mihon securely with Face ID.': 'Unlock Ahoge securely with Face ID.',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          text = '\n'.join(line for line in text.splitlines() if 'DEVELOPMENT_TEAM = DP5XP7C2AM;' not in line) + '\n'
          pbx.write_text(text)

          app = Path("Ahoge/AhogeApp.swift")
          text = app.read_text().replace('Mihon_IOSApp', 'AhogeApp').replace('//  Mihon IOS', '//  Ahoge')
          app.write_text(text)

          # Update obvious product-facing text without renaming internal persistence
          # symbols/types that may encode compatibility assumptions.
          for path in Path('Ahoge').rglob('*.swift'):
              text = path.read_text()
              updated = (text
                  .replace('//  Mihon IOS', '//  Ahoge')
                  .replace('Mihon iOS', 'Ahoge')
                  .replace('Mihon IOS', 'Ahoge')
                  .replace('Unlock Mihon securely', 'Unlock Ahoge securely'))
              if updated != text:
                  path.write_text(updated)

      - name: Remove hardcoded Asura fallback endpoints
        shell: python
        run: |
          from pathlib import Path

          path = Path('Ahoge/Data/RuntimeSourceRepository.swift')
          text = path.read_text()
          old = '''            case .asuraScans:\n                let baseURL = descriptor.context?.baseURL ?? descriptor.baseURL ?? "https://asurascans.com"\n                let apiURL = descriptor.overrides["apiURL"] ?? "https://api.asurascans.com/api"\n                runtimes[source.id] = AsuraScans2026SourceEngine(\n                    source: source,\n                    baseURL: baseURL,\n                    apiURL: apiURL\n                )\n'''
          new = '''            case .asuraScans:\n                guard\n                    let context = descriptor.context,\n                    let apiURL = descriptor.overrides["apiURL"],\n                    !context.baseURL.isEmpty,\n                    !apiURL.isEmpty\n                else { continue }\n                runtimes[source.id] = AsuraScans2026SourceEngine(\n                    source: source,\n                    baseURL: context.baseURL,\n                    apiURL: apiURL\n                )\n'''
          if old not in text:
              raise SystemExit('Expected Asura fallback block not found; refusing unsafe migration')
          path.write_text(text.replace(old, new))

      - name: Install Ahoge CI workflows
        shell: bash
        run: |
          cat > .github/workflows/ci.yml <<'YAML'
          name: Ahoge iOS CI

          on:
            pull_request:
              branches: ["**"]
            push:
              branches: ["main"]
            workflow_dispatch:

          jobs:
            build-and-test:
              name: Build and test
              runs-on: macos-latest
              timeout-minutes: 30
              env:
                PROJECT_PATH: Ahoge.xcodeproj
                PROJECT_FILE: Ahoge.xcodeproj/project.pbxproj
                SCHEME: Ahoge
                BUILD_DESTINATION: generic/platform=iOS Simulator
                TEST_DESTINATION: platform=iOS Simulator,OS=latest,name=iPhone 16
                DERIVED_DATA_PATH: .derivedData
              steps:
                - name: Checkout
                  uses: actions/checkout@v4
                - name: Show Xcode version
                  run: xcodebuild -version
                - name: Resolve package dependencies
                  run: xcodebuild -resolvePackageDependencies -project "$PROJECT_PATH" -scheme "$SCHEME"
                - name: Build app for iOS Simulator
                  run: |
                    set -eo pipefail
                    xcodebuild -project "$PROJECT_PATH" -scheme "$SCHEME" -destination "$BUILD_DESTINATION" -derivedDataPath "$DERIVED_DATA_PATH" -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO build
                - name: Run XCTest bundles when present
                  run: |
                    set -eo pipefail
                    if grep -Eq 'com\.apple\.product-type\.bundle\.(unit-test|ui-testing)' "$PROJECT_FILE"; then
                      xcodebuild -project "$PROJECT_PATH" -scheme "$SCHEME" -destination "$TEST_DESTINATION" -derivedDataPath "$DERIVED_DATA_PATH" -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO test
                    else
                      echo "No XCTest target found. Skipping test step."
                    fi
          YAML

          cat > .github/workflows/build-ipa.yml <<'YAML'
          name: Build Ahoge IPA

          on:
            workflow_dispatch:
            push:
              branches: ["main"]

          jobs:
            build-ipa:
              name: Build unsigned IPA
              runs-on: macos-latest
              timeout-minutes: 30
              env:
                PROJECT_PATH: Ahoge.xcodeproj
                SCHEME: Ahoge
                DERIVED_DATA_PATH: build
              steps:
                - name: Checkout repository
                  uses: actions/checkout@v4
                - name: Show Xcode version
                  run: xcodebuild -version
                - name: Resolve Swift package dependencies
                  run: xcodebuild -resolvePackageDependencies -project "$PROJECT_PATH" -scheme "$SCHEME"
                - name: Build unsigned iPhone app
                  run: |
                    set -eo pipefail
                    xcodebuild -project "$PROJECT_PATH" -scheme "$SCHEME" -configuration Release -sdk iphoneos -destination "generic/platform=iOS" -derivedDataPath "$DERIVED_DATA_PATH" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
                - name: Package unsigned IPA
                  run: |
                    set -eo pipefail
                    APP_PATH=$(find "$DERIVED_DATA_PATH/Build/Products/Release-iphoneos" -maxdepth 1 -type d -name "*.app" -print -quit)
                    test -n "$APP_PATH" || { echo "ERROR: No .app bundle was produced."; exit 1; }
                    rm -rf Payload Ahoge-iOS-unsigned.ipa
                    mkdir -p Payload
                    cp -R "$APP_PATH" Payload/
                    zip -qry Ahoge-iOS-unsigned.ipa Payload
                    ls -lh Ahoge-iOS-unsigned.ipa
                - name: Upload IPA artifact
                  uses: actions/upload-artifact@v4
                  with:
                    name: Ahoge-iOS-unsigned
                    path: Ahoge-iOS-unsigned.ipa
                    if-no-files-found: error
                    retention-days: 14
          YAML

      - name: Record migration audit
        shell: bash
        run: |
          mkdir -p Docs
          cat > Docs/migration-audit.md <<'MD'
          # Ahoge migration audit

          Baseline: `QuackyPROG/mihon-ios` `main`.

          ## Kept
          - `Mihon IOS/` application source, copied as `Ahoge/`
          - Xcode project definition and workspace metadata, copied as `Ahoge.xcodeproj`
          - application assets
          - library, reader, downloads/import, local files, persistence, networking, repository importer, source runtime contracts, and runtime engines
          - Apache-2.0 `LICENSE`
          - repository formatting/ignore configuration

          ## Moved to `ahoge-extension`
          - top-level `sources/index.json`
          - per-source JSON manifests for Asura Scans, QiScans, Omega Scans, and Manganato
          - remotely maintainable URLs/API configuration

          ## Intentionally excluded
          - old Git history
          - `build_log*.txt`
          - old repository docs/reports and publish-readiness artifacts
          - `Tools/`
          - `Mihon IOS.xcodeproj/xcuserdata/`
          - top-level `sources/` manifests
          - hardcoded `QuackyBuiltInSources.swift`
          - unreferenced legacy source engines when dependency checks proved no references

          ## Manual-review / retained compatibility code
          - legacy source-family enum cases and classifier scaffolding not used by the current maintained manifests
          - internal identifiers containing `Mihon` where renaming could affect persistence/compatibility rather than visible branding
          - runtime engines that are still referenced by compiled code even if not used by the initial extension repository
          MD

      - name: Remove one-shot workflow and verify source separation
        shell: bash
        run: |
          rm -f .github/workflows/migrate-ahoge.yml
          test ! -e sources/index.json
          test ! -e sources/asurascans.json
          test ! -e sources/qiscans.json
          test ! -e sources/omegascans.json
          test ! -e sources/manganato.json
          test ! -e Ahoge/Data/Sources/QuackyBuiltInSources.swift
          ! grep -R -n --include='*.swift' 'https://raw.githubusercontent.com/QuackyPROG/ahoge-extension' Ahoge
          grep -q 'path = Ahoge;' Ahoge.xcodeproj/project.pbxproj
          grep -q 'PRODUCT_BUNDLE_IDENTIFIER = com.quackyprog.ahoge;' Ahoge.xcodeproj/project.pbxproj

      - name: Commit migrated tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "QuackyPROG"
          git config user.email "206159932+QuackyPROG@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No migration changes to commit."
            exit 0
          fi
          git commit -m "refactor: migrate clean Ahoge application"
          git push origin HEAD:migration/clean-ahoge
