name: Migrate Ahoge Application Content

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: migration/clean-ahoge
          fetch-depth: 0

      - name: Fetch migration baseline
        run: git clone --depth 1 --branch main https://github.com/QuackyPROG/mihon-ios.git /tmp/mihon-ios

      - name: Copy audited application paths
        shell: bash
        run: |
          set -euo pipefail
          rm -rf Ahoge Ahoge.xcodeproj
          cp -R "/tmp/mihon-ios/Mihon IOS" Ahoge
          mkdir -p Ahoge.xcodeproj/project.xcworkspace
          cp "/tmp/mihon-ios/Mihon IOS.xcodeproj/project.pbxproj" Ahoge.xcodeproj/project.pbxproj
          cp "/tmp/mihon-ios/Mihon IOS.xcodeproj/project.xcworkspace/contents.xcworkspacedata" Ahoge.xcodeproj/project.xcworkspace/contents.xcworkspacedata
          cp /tmp/mihon-ios/LICENSE LICENSE
          cp /tmp/mihon-ios/.gitignore .gitignore
          cp /tmp/mihon-ios/.editorconfig .editorconfig

          # Remote source manifests and repository-level experimental artifacts are not copied.
          rm -f Ahoge/Data/Sources/QuackyBuiltInSources.swift

          # Only remove legacy engines when no compiled Swift source references them.
          remove_if_unreferenced() {
            local file="$1"
            local symbol="$2"
            if [ -f "$file" ] && ! grep -R --include='*.swift' --exclude="$(basename "$file")" -q "\b${symbol}\b" Ahoge; then
              rm -f "$file"
              echo "Removed unreferenced $file"
            fi
          }
          remove_if_unreferenced Ahoge/Data/Sources/AsuraAPISourceEngine.swift AsuraAPISourceEngine
          remove_if_unreferenced Ahoge/Data/Sources/AsuraHTMLSourceEngine.swift AsuraHTMLSourceEngine

          mv Ahoge/Mihon_IOSApp.swift Ahoge/AhogeApp.swift

      - name: Rename Ahoge product safely
        shell: python
        run: |
          from pathlib import Path

          pbx = Path("Ahoge.xcodeproj/project.pbxproj")
          text = pbx.read_text()
          replacements = {
              'Mihon IOS.app': 'Ahoge.app',
              '/* Mihon IOS */': '/* Ahoge */',
              '"Mihon IOS"': 'Ahoge',
              'path = "Mihon IOS";': 'path = Ahoge;',
              'productName = "Mihon IOS";': 'productName = Ahoge;',
              'PRODUCT_BUNDLE_IDENTIFIER = "giovanchristoffel.Mihon-IOS";': 'PRODUCT_BUNDLE_IDENTIFIER = com.quackyprog.ahoge;',
              'Unlock Mihon securely with Face ID.': 'Unlock Ahoge securely with Face ID.',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          text = '\n'.join(line for line in text.splitlines() if 'DEVELOPMENT_TEAM = DP5XP7C2AM;' not in line) + '\n'
          pbx.write_text(text)

          app = Path("Ahoge/AhogeApp.swift")
          app.write_text(app.read_text().replace('Mihon_IOSApp', 'AhogeApp').replace('//  Mihon IOS', '//  Ahoge'))

          # Product-facing rename only. Persistence/type compatibility identifiers remain intact.
          for path in Path('Ahoge').rglob('*.swift'):
              text = path.read_text()
              updated = (text
                  .replace('//  Mihon IOS', '//  Ahoge')
                  .replace('Mihon iOS', 'Ahoge')
                  .replace('Mihon IOS', 'Ahoge')
                  .replace('Unlock Mihon securely', 'Unlock Ahoge securely'))
              if updated != text:
                  path.write_text(updated)

      - name: Make source manifests authoritative
        shell: python
        run: |
          from pathlib import Path

          runtime = Path('Ahoge/Data/RuntimeSourceRepository.swift')
          text = runtime.read_text()
          old = '''            case .asuraScans:\n                let baseURL = descriptor.context?.baseURL ?? descriptor.baseURL ?? "https://asurascans.com"\n                let apiURL = descriptor.overrides["apiURL"] ?? "https://api.asurascans.com/api"\n                runtimes[source.id] = AsuraScans2026SourceEngine(\n                    source: source,\n                    baseURL: baseURL,\n                    apiURL: apiURL\n                )\n'''
          new = '''            case .asuraScans:\n                guard\n                    let context = descriptor.context,\n                    let apiURL = descriptor.overrides["apiURL"],\n                    !context.baseURL.isEmpty,\n                    !apiURL.isEmpty\n                else { continue }\n                runtimes[source.id] = AsuraScans2026SourceEngine(\n                    source: source,\n                    baseURL: context.baseURL,\n                    apiURL: apiURL\n                )\n'''
          if old not in text:
              raise SystemExit('Expected Asura fallback block not found; refusing unsafe migration')
          runtime.write_text(text.replace(old, new))

          importer = Path('Ahoge/Data/SourceRepoImporter.swift')
          text = importer.read_text()
          old = '''        "asurascans": OverrideProfile(\n            overrides: ["apiURL": "https://api.asurascans.com/api"],\n            additionalFlags: ["source-asura", "asura-2026"]\n        ),'''
          new = '''        "asurascans": OverrideProfile(\n            overrides: [:],\n            additionalFlags: ["source-asura", "asura-2026"]\n        ),'''
          if old not in text:
              raise SystemExit('Expected legacy Asura classifier override not found')
          importer.write_text(text.replace(old, new))

      - name: Record migration audit
        shell: bash
        run: |
          mkdir -p Docs
          cat > Docs/migration-audit.md <<'MD'
          # Ahoge migration audit

          Baseline: `QuackyPROG/mihon-ios` `main`.

          ## Keep
          - `Mihon IOS/` application source, migrated as `Ahoge/`
          - Xcode project definition and workspace metadata, migrated as `Ahoge.xcodeproj`
          - application assets
          - library, reader, downloads/import, local files, persistence, networking, source repository importer, runtime contracts, and referenced runtime engines
          - Apache-2.0 `LICENSE`
          - required repository formatting/ignore configuration

          ## Moved to `ahoge-extension`
          - source index
          - Asura Scans, QiScans, Omega Scans, and Manganato manifests
          - remotely maintained base/API URLs and source metadata

          ## Intentionally excluded
          - old Git history
          - `build_log*.txt`
          - stale audit/publish-readiness documents
          - `Tools/`
          - Xcode `xcuserdata/`
          - top-level `sources/` manifests
          - hardcoded `QuackyBuiltInSources.swift`
          - unreferenced legacy source engines only when dependency checks prove no Swift references

          ## Retained for compatibility / manual review
          - internal `Mihon` identifiers that are not user-visible and may affect persistence/import compatibility
          - legacy source-family classifier scaffolding
          - runtime engines still referenced by compiled code

          ## Licensing
          The upstream repository is Apache License 2.0. `LICENSE` is preserved. No upstream `NOTICE` file exists in the migration baseline, so no NOTICE file was invented.
          MD

      - name: Verify migration invariants
        shell: bash
        run: |
          set -euo pipefail
          test -e LICENSE
          test -e Ahoge/AhogeApp.swift
          test ! -e Ahoge/Mihon_IOSApp.swift
          test ! -e Ahoge/Data/Sources/QuackyBuiltInSources.swift
          test ! -e sources/index.json
          test ! -e sources/asurascans.json
          test ! -e sources/qiscans.json
          test ! -e sources/omegascans.json
          test ! -e sources/manganato.json
          ! grep -R -n --include='*.swift' 'https://raw.githubusercontent.com/QuackyPROG/ahoge-extension' Ahoge
          ! grep -R -n --include='*.swift' 'https://api.asurascans.com/api' Ahoge/Data/RuntimeSourceRepository.swift Ahoge/Data/SourceRepoImporter.swift
          grep -q 'path = Ahoge;' Ahoge.xcodeproj/project.pbxproj
          grep -q 'PRODUCT_BUNDLE_IDENTIFIER = com.quackyprog.ahoge;' Ahoge.xcodeproj/project.pbxproj

      - name: Commit migrated application content
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "QuackyPROG"
          git config user.email "206159932+QuackyPROG@users.noreply.github.com"
          git add -A -- . ':!.github/workflows'
          if git diff --cached --quiet; then
            echo "No application-content migration changes to commit."
            exit 0
          fi
          git commit -m "refactor: migrate clean Ahoge application"
          git push origin HEAD:migration/clean-ahoge
