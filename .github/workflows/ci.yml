name: Ahoge iOS CI

on:
  pull_request:
    branches: ["**"]
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      PROJECT_PATH: Ahoge.xcodeproj
      PROJECT_FILE: Ahoge.xcodeproj/project.pbxproj
      SCHEME: Ahoge
      BUILD_DESTINATION: generic/platform=iOS Simulator
      TEST_DESTINATION: platform=iOS Simulator,OS=latest,name=iPhone 16
      DERIVED_DATA_PATH: .derivedData
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate distribution metadata
        run: python3 Scripts/validate_distribution.py Distribution/source.json Distribution/latest.json
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Resolve package dependencies
        run: xcodebuild -resolvePackageDependencies -project "$PROJECT_PATH" -scheme "$SCHEME"
      - name: Build app for iOS Simulator
        run: |
          set -eo pipefail
          xcodebuild -project "$PROJECT_PATH" -scheme "$SCHEME" -destination "$BUILD_DESTINATION" -derivedDataPath "$DERIVED_DATA_PATH" -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO build
      - name: Run XCTest bundles when present
        run: |
          set -eo pipefail
          if grep -Eq 'com\.apple\.product-type\.bundle\.(unit-test|ui-testing)' "$PROJECT_FILE"; then
            xcodebuild -project "$PROJECT_PATH" -scheme "$SCHEME" -destination "$TEST_DESTINATION" -derivedDataPath "$DERIVED_DATA_PATH" -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO test
          else
            echo "No XCTest target found. Skipping test step."
          fi
      - name: Run domain and reader regression harnesses
        if: github.event_name == 'workflow_dispatch'
        run: python3 Scripts/run_mihon_domain_regressions.py
      - name: Build unsigned sideload app
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          xcodebuild -project "$PROJECT_PATH" -scheme "$SCHEME" \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath .derivedData-device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            INFOPLIST_KEY_AhogeDistributionChannel=sideload build
      - name: Package and validate sideload IPA
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          APP_PATH="$(find .derivedData-device/Build/Products/Release-iphoneos -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          PLIST="$APP_PATH/Info.plist"
          EXECUTABLE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$PLIST")"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")" = com.quackyprog.ahoge
          test -f "$APP_PATH/Assets.car"
          ARCHS="$(lipo -archs "$APP_PATH/$EXECUTABLE_NAME")"
          [[ " $ARCHS " == *" arm64 "* ]]
          [[ " $ARCHS " != *" x86_64 "* ]]
          mkdir -p sideload-staging/Payload sideload-artifacts
          cp -R "$APP_PATH" sideload-staging/Payload/
          (cd sideload-staging && zip -qry ../sideload-artifacts/Ahoge.ipa Payload)
          unzip -t sideload-artifacts/Ahoge.ipa
          (cd sideload-artifacts && shasum -a 256 Ahoge.ipa > Ahoge.ipa.sha256)
      - name: Upload unsigned IPA for Sideloadly
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Ahoge-sideload-${{ github.run_id }}
          path: sideload-artifacts/
          if-no-files-found: error
          retention-days: 7
