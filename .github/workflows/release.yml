name: Release Ahoge

on:
  push:
    tags:
      - "v*.*.*"
    branches:
      - "main"
    paths:
      - "Distribution/release-request.json"

permissions:
  contents: write

concurrency:
  group: ahoge-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      PROJECT_PATH: Ahoge.xcodeproj
      SCHEME: Ahoge
      DERIVED_DATA_PATH: build-release
      EXPECTED_BUNDLE_IDENTIFIER: com.quackyprog.ahoge
      RELEASE_REQUEST_PATH: Distribution/release-request.json

    steps:
      - name: Check out release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version and build
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAG="$GITHUB_REF_NAME"
            if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "ERROR: Release tags must match vMAJOR.MINOR.PATCH; got '$TAG'." >&2
              exit 1
            fi
            VERSION="${TAG#v}"

            SETTINGS="$(xcodebuild -project "$PROJECT_PATH" -scheme "$SCHEME" -configuration Release -sdk iphoneos -showBuildSettings)"
            BUILD_NUMBER="$(printf '%s\n' "$SETTINGS" | awk -F ' = ' '/^[[:space:]]*CURRENT_PROJECT_VERSION = / {print $2; exit}')"
            RELEASE_SOURCE="tag"
          else
            test -f "$RELEASE_REQUEST_PATH" || {
              echo "ERROR: Missing $RELEASE_REQUEST_PATH." >&2
              exit 1
            }

            VERSION="$(python3 - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path("Distribution/release-request.json").read_text(encoding="utf-8"))
          print(value.get("version", ""))
          PY
            )"
            BUILD_NUMBER="$(python3 - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path("Distribution/release-request.json").read_text(encoding="utf-8"))
          print(value.get("build", ""))
          PY
            )"
            TAG="v$VERSION"
            RELEASE_SOURCE="request"
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Version must match MAJOR.MINOR.PATCH; got '$VERSION'." >&2
            exit 1
          fi
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]] || {
            echo "ERROR: Build number must be a positive integer; got '$BUILD_NUMBER'." >&2
            exit 1
          }

          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "RELEASE_SOURCE=$RELEASE_SOURCE" >> "$GITHUB_ENV"
          echo "Releasing Ahoge $VERSION (build $BUILD_NUMBER) from $GITHUB_SHA via $RELEASE_SOURCE"

      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "ERROR: GitHub Release '$TAG' already exists. Versioned releases are immutable." >&2
            exit 1
          fi

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Resolve Swift package dependencies
        run: xcodebuild -resolvePackageDependencies -project "$PROJECT_PATH" -scheme "$SCHEME"

      - name: Build unsigned device app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            INFOPLIST_KEY_AhogeDistributionChannel=sideload \
            build

      - name: Validate app and package IPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find "$DERIVED_DATA_PATH/Build/Products/Release-iphoneos" -maxdepth 1 -type d -name "*.app" -print -quit)"
          test -n "$APP_PATH" || { echo "ERROR: No device .app bundle was produced." >&2; exit 1; }

          PLIST="$APP_PATH/Info.plist"
          test -f "$PLIST" || { echo "ERROR: Built app has no Info.plist." >&2; exit 1; }

          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")"
          APP_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")"
          APP_BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")"
          MIN_OS="$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$PLIST")"
          EXECUTABLE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$PLIST")"
          EXECUTABLE="$APP_PATH/$EXECUTABLE_NAME"

          test "$BUNDLE_ID" = "$EXPECTED_BUNDLE_IDENTIFIER" || {
            echo "ERROR: Bundle identifier changed from '$EXPECTED_BUNDLE_IDENTIFIER' to '$BUNDLE_ID'." >&2
            exit 1
          }
          test "$APP_VERSION" = "$VERSION" || {
            echo "ERROR: Expected app version '$VERSION' but CFBundleShortVersionString is '$APP_VERSION'." >&2
            exit 1
          }
          test "$APP_BUILD" = "$BUILD_NUMBER" || {
            echo "ERROR: Expected build '$BUILD_NUMBER' but CFBundleVersion is '$APP_BUILD'." >&2
            exit 1
          }
          test -n "$MIN_OS" || { echo "ERROR: MinimumOSVersion is empty." >&2; exit 1; }
          test -f "$EXECUTABLE" || { echo "ERROR: App executable is missing." >&2; exit 1; }
          test -f "$APP_PATH/Assets.car" || { echo "ERROR: Compiled app assets are missing." >&2; exit 1; }

          ARCHS="$(lipo -archs "$EXECUTABLE")"
          [[ " $ARCHS " == *" arm64 "* ]] || { echo "ERROR: Device executable is not arm64: $ARCHS" >&2; exit 1; }
          [[ " $ARCHS " != *" x86_64 "* ]] || { echo "ERROR: Simulator architecture found in device build: $ARCHS" >&2; exit 1; }

          rm -rf ipa-staging Ahoge.ipa
          mkdir -p ipa-staging/Payload
          cp -R "$APP_PATH" ipa-staging/Payload/
          (cd ipa-staging && zip -qry ../Ahoge.ipa Payload)

          unzip -t Ahoge.ipa >/dev/null
          unzip -l Ahoge.ipa | grep -Eq 'Payload/[^/]+\.app/Info\.plist' || {
            echo "ERROR: IPA does not contain Payload/<app>.app/Info.plist." >&2
            exit 1
          }

          SHA256="$(shasum -a 256 Ahoge.ipa | awk '{print $1}')"
          IPA_SIZE="$(stat -f%z Ahoge.ipa)"
          RELEASE_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          DOWNLOAD_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/Ahoge.ipa"
          RELEASE_NOTES_URL="https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"

          printf '%s  %s\n' "$SHA256" "Ahoge.ipa" > Ahoge.ipa.sha256

          echo "BUNDLE_ID=$BUNDLE_ID" >> "$GITHUB_ENV"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "APP_BUILD=$APP_BUILD" >> "$GITHUB_ENV"
          echo "MIN_OS=$MIN_OS" >> "$GITHUB_ENV"
          echo "SHA256=$SHA256" >> "$GITHUB_ENV"
          echo "IPA_SIZE=$IPA_SIZE" >> "$GITHUB_ENV"
          echo "RELEASE_DATE=$RELEASE_DATE" >> "$GITHUB_ENV"
          echo "DOWNLOAD_URL=$DOWNLOAD_URL" >> "$GITHUB_ENV"
          echo "RELEASE_NOTES_URL=$RELEASE_NOTES_URL" >> "$GITHUB_ENV"

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$RELEASE_SOURCE" == "request" ]]; then
            python3 - <<'PY' > release-notes.md
          import json
          from pathlib import Path

          value = json.loads(Path("Distribution/release-request.json").read_text(encoding="utf-8"))
          notes = str(value.get("releaseNotes", "")).strip()
          if not notes:
              raise SystemExit("release-request.json must contain non-empty releaseNotes")
          print(notes)
          PY
          else
            gh api \
              --method POST \
              "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="$TAG" \
              -f target_commitish="$GITHUB_SHA" \
              --jq '.body' > release-notes.md
          fi

          if [[ ! -s release-notes.md ]]; then
            printf 'Ahoge %s\n' "$VERSION" > release-notes.md
          fi

      - name: Generate machine-readable release metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          notes = Path("release-notes.md").read_text(encoding="utf-8").strip()
          common = {
              "version": os.environ["APP_VERSION"],
              "build": os.environ["APP_BUILD"],
              "minimumOSVersion": os.environ["MIN_OS"],
              "releaseDate": os.environ["RELEASE_DATE"],
              "downloadURL": os.environ["DOWNLOAD_URL"],
              "sha256": os.environ["SHA256"],
              "releaseNotesURL": os.environ["RELEASE_NOTES_URL"],
              "size": int(os.environ["IPA_SIZE"]),
          }
          metadata = {
              "schemaVersion": 1,
              "bundleIdentifier": os.environ["BUNDLE_ID"],
              "tag": os.environ["TAG"],
              "commit": os.environ["GITHUB_SHA"],
              **common,
          }
          manifest = {
              "schemaVersion": 1,
              "available": True,
              "channel": "sideload",
              "sourceURL": "https://raw.githubusercontent.com/QuackyPROG/ahoge/main/Distribution/source.json",
              "releaseNotes": notes,
              **common,
          }
          Path("release-metadata.json").write_text(json.dumps(metadata, indent=2) + "\n", encoding="utf-8")
          Path("release.json").write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          PY

          python3 -m json.tool release-metadata.json >/dev/null
          python3 -m json.tool release.json >/dev/null

      - name: Create immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$RELEASE_SOURCE" == "tag" ]]; then
            gh release create "$TAG" \
              Ahoge.ipa \
              Ahoge.ipa.sha256 \
              release-metadata.json \
              release.json \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "Ahoge $VERSION" \
              --notes-file release-notes.md
          else
            gh release create "$TAG" \
              Ahoge.ipa \
              Ahoge.ipa.sha256 \
              release-metadata.json \
              release.json \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Ahoge $VERSION" \
              --notes-file release-notes.md
          fi

      - name: Update SideStore source, app manifest, and project version on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          rm -rf /tmp/ahoge-main
          git worktree add --detach /tmp/ahoge-main origin/main

          python3 Scripts/update_distribution.py \
            --source /tmp/ahoge-main/Distribution/source.json \
            --latest /tmp/ahoge-main/Distribution/latest.json \
            --metadata release-metadata.json \
            --manifest release.json \
            --notes release-notes.md

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("/tmp/ahoge-main/Ahoge.xcodeproj/project.pbxproj")
          text = path.read_text(encoding="utf-8")
          text = re.sub(
              r"CURRENT_PROJECT_VERSION = [^;]+;",
              f"CURRENT_PROJECT_VERSION = {os.environ['BUILD_NUMBER']};",
              text,
          )
          text = re.sub(
              r"MARKETING_VERSION = [^;]+;",
              f"MARKETING_VERSION = {os.environ['VERSION']};",
              text,
          )
          path.write_text(text, encoding="utf-8")
          PY

          python3 Scripts/validate_distribution.py \
            /tmp/ahoge-main/Distribution/source.json \
            /tmp/ahoge-main/Distribution/latest.json

          git -C /tmp/ahoge-main config user.name "github-actions[bot]"
          git -C /tmp/ahoge-main config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C /tmp/ahoge-main add \
            Ahoge.xcodeproj/project.pbxproj \
            Distribution/source.json \
            Distribution/latest.json
          if git -C /tmp/ahoge-main diff --cached --quiet; then
            echo "Distribution metadata and project version already match this release."
          else
            git -C /tmp/ahoge-main commit -m "chore(distribution): publish $TAG"
            git -C /tmp/ahoge-main push origin HEAD:main
          fi
