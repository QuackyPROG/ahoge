name: Patch Madara Importer Compatibility

on:
  push:
    branches:
      - fix/madara-importer-runtime-availability

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/madara-importer-runtime-availability
          fetch-depth: 0
      - name: Mark merged Madara runtime as importable
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("Ahoge/Data/SourceRepoImporter.swift")
          text = path.read_text()
          old = "case .asuraScans, .natsuId:\n            return true"
          new = "case .asuraScans, .natsuId, .madara:\n            return true"
          if old not in text:
              if new in text:
                  raise SystemExit(0)
              raise SystemExit("Expected runtimeIsAvailable switch case was not found; refusing to edit.")
          path.write_text(text.replace(old, new, 1))
          PY
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Ahoge/Data/SourceRepoImporter.swift
          git commit -m "Mark Madara runtime live for imported manifests"
          git push origin HEAD:fix/madara-importer-runtime-availability
