name: Patch MangaThemesia Common Contract

on:
  push:
    branches:
      - fix/mangathemesia-common-contract

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mangathemesia-common-contract
          fetch-depth: 0
      - name: Align MangaThemesia runtime with common upstream behavior
        run: |
          python3 - <<'PY'
          from pathlib import Path

          runtime = Path('Ahoge/Data/Sources/MangaThemesiaSourceEngine.swift')
          text = runtime.read_text()

          title_old = (
              '                #"<(?:h1|h2|h3)[^>]*class=["\'][^"\']*entry-title[^"\']*["\'][^>]*>([\\s\\S]*?)</(?:h1|h2|h3)>"#,\n'
              '                #"<meta[^>]+property=["\']og:title["\'][^>]+content=["\']([^"\']+)["\']"#,\n'
          )
          title_new = (
              '                #"<(?:h1|h2|h3)[^>]*class=["\'][^"\']*entry-title[^"\']*["\'][^>]*>([\\s\\S]*?)</(?:h1|h2|h3)>"#,\n'
              '                #"<[^>]+class=["\'][^"\']*ts-breadcrumb[^"\']*["\'][^>]*>[\\s\\S]*<li[^>]*>[\\s\\S]*?<span[^>]*>([\\s\\S]*?)</span>"#,\n'
              '                #"<meta[^>]+property=["\']og:title["\'][^>]+content=["\']([^"\']+)["\']"#,\n'
          )
          if title_old not in text:
              raise SystemExit('MangaThemesia title anchor changed; refusing to patch')
          text = text.replace(title_old, title_new, 1)

          guard_old = (
              '            let resolved = absoluteURL(href)\n'
              '            guard isChapterURL(resolved, mangaSlug: slug), seen.insert(resolved).inserted else { continue }\n'
          )
          guard_new = (
              '            let resolved = absoluteURL(href)\n'
              '            guard\n'
              '                looksLikeChapterBlock(block),\n'
              '                isSameSiteURL(resolved),\n'
              '                seen.insert(resolved).inserted\n'
              '            else { continue }\n'
          )
          if guard_old not in text:
              raise SystemExit('MangaThemesia chapter guard anchor changed; refusing to patch')
          text = text.replace(guard_old, guard_new, 1)

          helper_old = (
              '    private func isChapterURL(_ value: String, mangaSlug: String) -> Bool {\n'
              '        guard let parsed = URL(string: value) else { return false }\n'
              '        let parts = parsed.pathComponents.filter { $0 != "/" }\n'
              '        guard\n'
              '            let mangaIndex = parts.firstIndex(of: mangaPath),\n'
              '            parts.indices.contains(mangaIndex + 1),\n'
              '            parts[mangaIndex + 1] == mangaSlug\n'
              '        else { return false }\n'
              '        return parts.count > mangaIndex + 2\n'
              '    }\n'
          )
          helper_new = (
              '    private func looksLikeChapterBlock(_ block: String) -> Bool {\n'
              '        let lowered = block.lowercased()\n'
              '        return ["chapternum", "chapterdate", "chbox", "eph-num", "lch"].contains { lowered.contains($0) }\n'
              '    }\n\n'
              '    private func isSameSiteURL(_ value: String) -> Bool {\n'
              '        guard\n'
              '            let targetHost = URL(string: value)?.host?.lowercased(),\n'
              '            let baseHost = URL(string: baseURL)?.host?.lowercased()\n'
              '        else { return false }\n'
              '        return targetHost == baseHost\n'
              '    }\n'
          )
          if helper_old not in text:
              raise SystemExit('MangaThemesia chapter helper anchor changed; refusing to patch')
          text = text.replace(helper_old, helper_new, 1)
          runtime.write_text(text)

          importer = Path('Ahoge/Data/SourceRepoImporter.swift')
          text = importer.read_text()
          old = 'case .asuraScans, .natsuId, .madara:\n            return true'
          new = 'case .asuraScans, .natsuId, .madara, .mangaThemesia:\n            return true'
          if old not in text:
              if new not in text:
                  raise SystemExit('runtimeIsAvailable anchor changed; refusing to patch')
          else:
              text = text.replace(old, new, 1)
          importer.write_text(text)
          PY
          git rm .github/workflows/patch-mangathemesia-contract.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Ahoge/Data/Sources/MangaThemesiaSourceEngine.swift Ahoge/Data/SourceRepoImporter.swift
          git commit -m "Align MangaThemesia runtime with common family contract"
          git push origin HEAD:fix/mangathemesia-common-contract
