name: Patch MangaThemesia Common Contract

on:
  push:
    branches:
      - fix/mangathemesia-common-contract

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mangathemesia-common-contract
          fetch-depth: 0
      - name: Align MangaThemesia runtime with common upstream behavior
        run: |
          python3 - <<'PY'
          from pathlib import Path

          runtime = Path('Ahoge/Data/Sources/MangaThemesiaSourceEngine.swift')
          text = runtime.read_text()

          title_old = '''                #"<(?:h1|h2|h3)[^>]*class=["'][^"']*entry-title[^"']*["'][^>]*>([\\s\\S]*?)</(?:h1|h2|h3)>"#,
                #"<meta[^>]+property=["']og:title["'][^>]+content=["']([^"']+)["']"#,
'''
          title_new = '''                #"<(?:h1|h2|h3)[^>]*class=["'][^"']*entry-title[^"']*["'][^>]*>([\\s\\S]*?)</(?:h1|h2|h3)>"#,
                #"<[^>]+class=["'][^"']*ts-breadcrumb[^"']*["'][^>]*>[\\s\\S]*<li[^>]*>[\\s\\S]*?<span[^>]*>([\\s\\S]*?)</span>"#,
                #"<meta[^>]+property=["']og:title["'][^>]+content=["']([^"']+)["']"#,
'''
          if title_old not in text:
              raise SystemExit('MangaThemesia title anchor changed; refusing to patch')
          text = text.replace(title_old, title_new, 1)

          guard_old = '''            let resolved = absoluteURL(href)
            guard isChapterURL(resolved, mangaSlug: slug), seen.insert(resolved).inserted else { continue }
'''
          guard_new = '''            let resolved = absoluteURL(href)
            guard
                looksLikeChapterBlock(block),
                isSameSiteURL(resolved),
                seen.insert(resolved).inserted
            else { continue }
'''
          if guard_old not in text:
              raise SystemExit('MangaThemesia chapter guard anchor changed; refusing to patch')
          text = text.replace(guard_old, guard_new, 1)

          helper_old = '''    private func isChapterURL(_ value: String, mangaSlug: String) -> Bool {
        guard let parsed = URL(string: value) else { return false }
        let parts = parsed.pathComponents.filter { $0 != "/" }
        guard
            let mangaIndex = parts.firstIndex(of: mangaPath),
            parts.indices.contains(mangaIndex + 1),
            parts[mangaIndex + 1] == mangaSlug
        else { return false }
        return parts.count > mangaIndex + 2
    }
'''
          helper_new = '''    private func looksLikeChapterBlock(_ block: String) -> Bool {
        let lowered = block.lowercased()
        return ["chapternum", "chapterdate", "chbox", "eph-num", "lch"].contains { lowered.contains($0) }
    }

    private func isSameSiteURL(_ value: String) -> Bool {
        guard
            let targetHost = URL(string: value)?.host?.lowercased(),
            let baseHost = URL(string: baseURL)?.host?.lowercased()
        else { return false }
        return targetHost == baseHost
    }
'''
          if helper_old not in text:
              raise SystemExit('MangaThemesia chapter helper anchor changed; refusing to patch')
          text = text.replace(helper_old, helper_new, 1)
          runtime.write_text(text)

          importer = Path('Ahoge/Data/SourceRepoImporter.swift')
          text = importer.read_text()
          old = 'case .asuraScans, .natsuId, .madara:\n            return true'
          new = 'case .asuraScans, .natsuId, .madara, .mangaThemesia:\n            return true'
          if old not in text:
              if new not in text:
                  raise SystemExit('runtimeIsAvailable anchor changed; refusing to patch')
          else:
              text = text.replace(old, new, 1)
          importer.write_text(text)
          PY
          git rm .github/workflows/patch-mangathemesia-contract.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Ahoge/Data/Sources/MangaThemesiaSourceEngine.swift Ahoge/Data/SourceRepoImporter.swift
          git commit -m "Align MangaThemesia runtime with common family contract"
          git push origin HEAD:fix/mangathemesia-common-contract
