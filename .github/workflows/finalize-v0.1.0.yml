name: Finalize Ahoge v0.1.0

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/finalize-v0.1.0.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ahoge-v0.1.0-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    name: Build, publish, and clean branches
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      ROOT_SHA: 2243b35e16023f7ae0f982373015b539b35d2093
      PROJECT_PATH: Ahoge.xcodeproj
      SCHEME: Ahoge
      VERSION: 0.1.0
      BUILD_NUMBER: 1
      TAG: v0.1.0
      BUNDLE_ID: com.quackyprog.ahoge

    steps:
      - name: Check out clean release root
        uses: actions/checkout@v4
        with:
          ref: ${{ env.ROOT_SHA }}
          fetch-depth: 0

      - name: Verify clean root and release invariants
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ROOT_SHA"
          test "$(git rev-list --parents -n 1 HEAD | wc -w | tr -d ' ')" = "1" || {
            echo "ERROR: release root unexpectedly has a parent" >&2
            exit 1
          }
          test "$(git log -1 --pretty=%s)" = "Initial Ahoge release"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "ERROR: $TAG already exists" >&2
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "ERROR: GitHub Release $TAG already exists" >&2
            exit 1
          fi

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project "$PROJECT_PATH" -scheme "$SCHEME"

      - name: Build unsigned physical-device app
        shell: bash
        run: |
          set -euo pipefail
          DERIVED="$RUNNER_TEMP/device-derived"
          OUT="$RUNNER_TEMP/release"
          mkdir -p "$OUT"

          SETTINGS="$(xcodebuild -project "$PROJECT_PATH" -scheme "$SCHEME" -configuration Release -sdk iphoneos -showBuildSettings)"
          PROJECT_VERSION="$(printf '%s\n' "$SETTINGS" | awk -F ' = ' '/^[[:space:]]*MARKETING_VERSION = / {print $2; exit}')"
          PROJECT_BUILD="$(printf '%s\n' "$SETTINGS" | awk -F ' = ' '/^[[:space:]]*CURRENT_PROJECT_VERSION = / {print $2; exit}')"
          PROJECT_BUNDLE="$(printf '%s\n' "$SETTINGS" | awk -F ' = ' '/^[[:space:]]*PRODUCT_BUNDLE_IDENTIFIER = / {print $2; exit}')"
          test "$PROJECT_VERSION" = "$VERSION"
          test "$PROJECT_BUILD" = "$BUILD_NUMBER"
          test "$PROJECT_BUNDLE" = "$BUNDLE_ID"

          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            INFOPLIST_KEY_AhogeDistributionChannel=sideload \
            build

          APP_PATH="$(find "$DERIVED/Build/Products/Release-iphoneos" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          PLIST="$APP_PATH/Info.plist"
          test -f "$PLIST"

          ACTUAL_BUNDLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")"
          ACTUAL_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")"
          ACTUAL_BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")"
          MIN_OS="$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$PLIST")"
          EXEC_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$PLIST")"
          EXECUTABLE="$APP_PATH/$EXEC_NAME"

          test "$ACTUAL_BUNDLE" = "$BUNDLE_ID"
          test "$ACTUAL_VERSION" = "$VERSION"
          test "$ACTUAL_BUILD" = "$BUILD_NUMBER"
          test -n "$MIN_OS"
          test -f "$EXECUTABLE"
          test -f "$APP_PATH/Assets.car"

          ARCHS="$(lipo -archs "$EXECUTABLE")"
          [[ " $ARCHS " == *" arm64 "* ]]
          [[ " $ARCHS " != *" x86_64 "* ]]
          BUILD_INFO="$(xcrun vtool -show-build "$EXECUTABLE")"
          printf '%s\n' "$BUILD_INFO" | grep -q 'platform IOS'
          if printf '%s\n' "$BUILD_INFO" | grep -q 'IOSSIMULATOR'; then
            echo "ERROR: simulator platform found in device binary" >&2
            exit 1
          fi

          mkdir -p "$OUT/Payload"
          cp -R "$APP_PATH" "$OUT/Payload/"
          (cd "$OUT" && zip -qry Ahoge.ipa Payload)
          rm -rf "$OUT/Payload"
          unzip -t "$OUT/Ahoge.ipa" >/dev/null
          unzip -l "$OUT/Ahoge.ipa" | grep -Eq 'Payload/[^/]+\.app/Info\.plist'

          SHA256="$(shasum -a 256 "$OUT/Ahoge.ipa" | awk '{print $1}')"
          IPA_SIZE="$(stat -f%z "$OUT/Ahoge.ipa")"
          RELEASE_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          printf '%s  %s\n' "$SHA256" Ahoge.ipa > "$OUT/Ahoge.ipa.sha256"

          echo "OUT=$OUT" >> "$GITHUB_ENV"
          echo "MIN_OS=$MIN_OS" >> "$GITHUB_ENV"
          echo "SHA256=$SHA256" >> "$GITHUB_ENV"
          echo "IPA_SIZE=$IPA_SIZE" >> "$GITHUB_ENV"
          echo "RELEASE_DATE=$RELEASE_DATE" >> "$GITHUB_ENV"

      - name: Generate release metadata
        shell: bash
        run: |
          set -euo pipefail
          cat > "$OUT/release-notes.md" <<'EOF'
          Initial standalone Ahoge release.

          - Native Swift/SwiftUI manga reader for iOS.
          - Unsigned physical-device IPA for SideStore signing.
          - Repository-driven manga sources maintained separately in ahoge-extension.
          - Reader, library, downloads, persistence, source imports, and native source runtimes included.
          EOF

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          out = Path(os.environ["OUT"])
          download = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{os.environ['TAG']}/Ahoge.ipa"
          release_url = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/tag/{os.environ['TAG']}"
          notes = out.joinpath("release-notes.md").read_text(encoding="utf-8").strip()
          common = {
              "version": os.environ["VERSION"],
              "build": os.environ["BUILD_NUMBER"],
              "minimumOSVersion": os.environ["MIN_OS"],
              "releaseDate": os.environ["RELEASE_DATE"],
              "downloadURL": download,
              "sha256": os.environ["SHA256"],
              "releaseNotesURL": release_url,
              "size": int(os.environ["IPA_SIZE"]),
          }
          metadata = {
              "schemaVersion": 1,
              "bundleIdentifier": os.environ["BUNDLE_ID"],
              "tag": os.environ["TAG"],
              "commit": os.environ["ROOT_SHA"],
              **common,
          }
          manifest = {
              "schemaVersion": 1,
              "available": True,
              "channel": "sideload",
              "sourceURL": "https://raw.githubusercontent.com/QuackyPROG/ahoge/main/Distribution/source.json",
              "releaseNotes": notes,
              **common,
          }
          out.joinpath("release-metadata.json").write_text(json.dumps(metadata, indent=2) + "\n", encoding="utf-8")
          out.joinpath("release.json").write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Delete legacy public branches
        shell: bash
        run: |
          set -euo pipefail
          git ls-remote --heads origin | while read -r sha ref; do
            branch="${ref#refs/heads/}"
            if [[ "$branch" != "main" ]]; then
              echo "Deleting legacy branch: $branch"
              git push origin --delete "$branch"
            fi
          done

      - name: Create v0.1.0 tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "QuackyPROG"
          git config user.email "206159932+QuackyPROG@users.noreply.github.com"
          git tag -a "$TAG" "$ROOT_SHA" -m "Ahoge $VERSION"
          git push origin "refs/tags/$TAG"

          gh release create "$TAG" \
            "$OUT/Ahoge.ipa" \
            "$OUT/Ahoge.ipa.sha256" \
            "$OUT/release-metadata.json" \
            "$OUT/release.json" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Ahoge $VERSION" \
            --notes-file "$OUT/release-notes.md"

      - name: Verify public release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ASSETS="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          grep -qx 'Ahoge.ipa' <<< "$ASSETS"
          grep -qx 'Ahoge.ipa.sha256' <<< "$ASSETS"
          grep -qx 'release-metadata.json' <<< "$ASSETS"
          grep -qx 'release.json' <<< "$ASSETS"

          PUBLIC_IPA="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/Ahoge.ipa"
          curl -fL --retry 5 --retry-delay 2 "$PUBLIC_IPA" -o "$RUNNER_TEMP/public-Ahoge.ipa"
          PUBLIC_SHA="$(shasum -a 256 "$RUNNER_TEMP/public-Ahoge.ipa" | awk '{print $1}')"
          test "$PUBLIC_SHA" = "$SHA256"
          echo "Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
          echo "IPA: $PUBLIC_IPA"
          echo "SHA-256: $SHA256"
